name: Apply reservation links

on:
  schedule:
    # Runs a few minutes before the "research new entries" Claude Routine,
    # so that Routine reads a fresh UNMATCHED list each time instead of a
    # stale one from up to an hour ago.
    - cron: "50 * * * *"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-reservation-links.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
